<div class="meta meta-bar" role="region" aria-label="Reviewer controls">

  <div class="group">
    <button type="button" id="panel-prev" aria-label="Previous panel">‹</button>

    <button type="button" id="panel-next" aria-label="Next panel">›</button>
  </div>

  <div class="group" role="group" aria-label="Theme">
    <button type="button" data-theme-set="auto" aria-pressed="true">Auto</button>
    <button type="button" data-theme-set="light" aria-pressed="false">Light</button>

      <button class="avatar" type="button" aria-label="Account"><svg class="icon" aria-hidden="true"><use href="#i-user"/></svg></button>
